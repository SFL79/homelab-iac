apiVersion: v1
kind: Service
metadata:
  name: netdata
  namespace: bootstrap-proxies
spec:
  ports:
    - port: 19999
      targetPort: 19999
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: netdata
  namespace: bootstrap-proxies
  labels:
    kubernetes.io/service-name: netdata
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.118
ports:
  - port: 19999
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: netdata-v3-redirect
  namespace: bootstrap-proxies
spec:
  redirectRegex:
    regex: "^http://netdata\\.sfl/?$"
    replacement: "http://netdata.sfl/v3/"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netdata
  namespace: bootstrap-proxies
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Netdata
    gethomepage.dev/description: Homelab metrics and health
    gethomepage.dev/group: Operations
    gethomepage.dev/icon: netdata.png
    gethomepage.dev/href: http://netdata.sfl
    # Netdata returns HTTP 400 to HEAD on every path; Homepage's HTTP monitor
    # therefore cannot distinguish it from an outage. Ping the parent host.
    gethomepage.dev/ping: 192.168.1.118
    gethomepage.dev/external: "true"
    gethomepage.dev/weight: "10"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`netdata.sfl`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: netdata-v3-redirect
      services:
        - name: netdata
          port: 19999
