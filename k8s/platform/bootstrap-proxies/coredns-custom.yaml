apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  sfl.server: |
    sfl:53 {
        template IN A {
            answer "{{ .Name }} 60 IN A 192.168.1.120"
        }
        # The zone is IPv4-only. Return NODATA rather than SERVFAIL so
        # dual-stack getaddrinfo callers can still use the A response.
        template IN AAAA {
            rcode NOERROR
        }
    }
