apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-stack-secrets
  namespace: ai-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ai-stack-secrets
    creationPolicy: Owner
    template:
      data:
        GEMINI_API_KEY: "{{ .gemini_api_key }}"
        LITELLM_API_KEY: "{{ .gemini_api_key }}"
        LITELLM_MASTER_KEY: "{{ .litellm_master_key }}"
        KILO_API_KEY: "{{ .kilo_api_key }}"
        # semicolon-joined for OWUI's OPENAI_API_KEYS: litellm first, hermes second
        OPENAI_API_KEYS: "{{ .litellm_master_key }};{{ .hermes_api_key }}"
        LITELLM_DB_PASSWORD: "{{ .litellm_db_password }}"
        OPENWEBUI_OIDC_CLIENT_SECRET: "{{ .openwebui_oidc_client_secret }}"
  data:
    - secretKey: gemini_api_key
      remoteRef:
        key: secret/ai-stack
        property: gemini_api_key
    - secretKey: litellm_master_key
      remoteRef:
        key: secret/ai-stack
        property: litellm_master_key
    - secretKey: kilo_api_key
      remoteRef:
        key: secret/ai-stack
        property: kilo_api_key
    - secretKey: litellm_db_password
      remoteRef:
        key: secret/ai-stack
        property: litellm_db_password
    - secretKey: hermes_api_key
      remoteRef:
        key: secret/hermes
        property: api_server_key
    - secretKey: openwebui_oidc_client_secret
      remoteRef:
        key: secret/ai-stack
        property: openwebui_oidc_client_secret
