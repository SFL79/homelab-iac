apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-litellm
  namespace: ai-stack
spec:
  serviceName: postgres-litellm
  replicas: 1
  selector:
    matchLabels:
      app: postgres-litellm
  template:
    metadata:
      labels:
        app: postgres-litellm
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_USER
              value: litellm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-stack-secrets
                  key: LITELLM_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-local
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-litellm
  namespace: ai-stack
spec:
  selector:
    app: postgres-litellm
  ports:
    - port: 5432
      targetPort: 5432
