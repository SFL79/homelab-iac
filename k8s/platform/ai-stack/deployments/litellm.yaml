apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: docker.litellm.ai/berriai/litellm:main-latest
          args: ["--config=/app/config.yaml"]
          ports:
            - containerPort: 4000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-stack-secrets
                  key: GEMINI_API_KEY
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-stack-secrets
                  key: LITELLM_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-stack-secrets
                  key: LITELLM_MASTER_KEY
            - name: KILO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-stack-secrets
                  key: KILO_API_KEY
            - name: LITELLM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-stack-secrets
                  key: LITELLM_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://litellm:$(LITELLM_DB_PASSWORD)@postgres-litellm:5432/litellm"
            - name: STORE_MODEL_IN_DB
              value: "True"
          # Langfuse credentials — injected via a separate optional secret so LiteLLM
          # starts cleanly before Vault is populated with Langfuse API keys.
          # Populated after: Langfuse UI up → API keys minted → vault kv put secret/ai-stack
          envFrom:
            - secretRef:
                name: langfuse-litellm-secrets
                optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: litellm_config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-stack
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm
  namespace: ai-stack
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: LiteLLM
    gethomepage.dev/description: OpenAI-compatible model gateway
    gethomepage.dev/group: AI
    gethomepage.dev/icon: sh-litellm.svg
    gethomepage.dev/href: http://litellm.sfl/ui
    gethomepage.dev/siteMonitor: http://litellm.sfl
    gethomepage.dev/external: "true"
    gethomepage.dev/weight: "20"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`litellm.sfl`)
      kind: Rule
      services:
        - name: litellm
          port: 4000
