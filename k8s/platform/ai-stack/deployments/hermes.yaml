apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: ai-stack
spec:
  ports:
    - name: http
      port: 8642
      targetPort: 8642
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hermes
  namespace: ai-stack
  labels:
    kubernetes.io/service-name: hermes
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.118
ports:
  - name: http
    port: 8642
    protocol: TCP
