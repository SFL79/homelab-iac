apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-terminal-secret
  namespace: ai-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: open-terminal-secret
    creationPolicy: Owner
    template:
      data:
        OPEN_TERMINAL_API_KEY: "{{ .open_terminal_api_key }}"
  data:
    - secretKey: open_terminal_api_key
      remoteRef:
        key: secret/ai-stack
        property: open_terminal_api_key
