# Separate ExternalSecret for Langfuse credentials consumed by LiteLLM.
# Kept isolated from ai-stack-secrets so a missing Vault path here does not
# break the main ExternalSecret (and thus OWUI + LiteLLM) during deployment.
# Populate Vault AFTER minting API keys in the Langfuse UI:
#   vault kv put secret/ai-stack \
#     langfuse_public_key=pk-lf-... \
#     langfuse_secret_key=sk-lf-... \
#     langfuse_host=http://langfuse-web.langfuse.svc.cluster.local:3000
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-litellm-secrets
  namespace: ai-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-litellm-secrets
    creationPolicy: Owner
    template:
      data:
        LANGFUSE_PUBLIC_KEY: "{{ .langfuse_public_key }}"
        LANGFUSE_SECRET_KEY: "{{ .langfuse_secret_key }}"
        LANGFUSE_HOST: "{{ .langfuse_host }}"
  data:
    - secretKey: langfuse_public_key
      remoteRef:
        key: secret/ai-stack
        property: langfuse_public_key
    - secretKey: langfuse_secret_key
      remoteRef:
        key: secret/ai-stack
        property: langfuse_secret_key
    - secretKey: langfuse_host
      remoteRef:
        key: secret/ai-stack
        property: langfuse_host
