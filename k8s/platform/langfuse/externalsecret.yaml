apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
    template:
      data:
        NEXTAUTH_SECRET: "{{ .nextauth_secret }}"
        SALT: "{{ .salt }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        # Sub-chart passwords for internal cluster use only.
        postgres-password: "{{ .postgres_password }}"
        clickhouse-password: "{{ .clickhouse_password }}"
        redis-password: "{{ .redis_password }}"
  data:
    - secretKey: nextauth_secret
      remoteRef:
        key: secret/langfuse
        property: nextauth_secret
    - secretKey: salt
      remoteRef:
        key: secret/langfuse
        property: salt
    - secretKey: encryption_key
      remoteRef:
        key: secret/langfuse
        property: encryption_key
    - secretKey: postgres_password
      remoteRef:
        key: secret/langfuse
        property: postgres_password
    - secretKey: clickhouse_password
      remoteRef:
        key: secret/langfuse
        property: clickhouse_password
    - secretKey: redis_password
      remoteRef:
        key: secret/langfuse
        property: redis_password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-s3
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-s3
    creationPolicy: Owner
    template:
      data:
        root-user: "{{ .minio_root_user }}"
        root-password: "{{ .minio_root_password }}"
  data:
    - secretKey: minio_root_user
      remoteRef:
        key: secret/langfuse
        property: minio_root_user
    - secretKey: minio_root_password
      remoteRef:
        key: secret/langfuse
        property: minio_root_password
