apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: sf-y530
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Asia/Jerusalem
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
            - containerPort: 6881
              protocol: TCP
              hostPort: 6881
            - containerPort: 6881
              protocol: UDP
              hostPort: 6881
          volumeMounts:
            - name: media-base
              mountPath: /config
              subPath: qbittorrent-config
            - name: media-base
              mountPath: /data/torrents
              subPath: torrents
      volumes:
        - name: media-base
          persistentVolumeClaim:
            claimName: media-base
      # gluetun (add when VPN key available):
      # - add sidecar using ghcr.io/qdm12/gluetun
      # - vault path: secret/media-stack → vpn_provider, vpn_username, vpn_password
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media-stack
spec:
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: media-stack
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: qBittorrent
    gethomepage.dev/description: Download client
    gethomepage.dev/group: Media
    gethomepage.dev/icon: qbittorrent.png
    gethomepage.dev/href: http://qbit.sfl
    gethomepage.dev/siteMonitor: http://qbit.sfl
    gethomepage.dev/external: "true"
    gethomepage.dev/weight: "60"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`qbit.sfl`)
      kind: Rule
      services:
        - name: qbittorrent
          port: 8080
