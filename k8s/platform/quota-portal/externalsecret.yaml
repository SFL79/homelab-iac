apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quota-portal-secrets
  namespace: quota-portal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: quota-portal-secrets
    creationPolicy: Owner
    template:
      data:
        OIDC_CLIENT_SECRET: "{{ .keycloak_client_secret }}"
        SESSION_SECRET: "{{ .session_secret }}"
  data:
    - secretKey: keycloak_client_secret
      remoteRef:
        key: secret/quota-portal
        property: keycloak_client_secret
    - secretKey: session_secret
      remoteRef:
        key: secret/quota-portal
        property: session_secret
---
# LiteLLM master key lives in secret/ai-stack alongside the rest of the LiteLLM
# config. Pulling it from there avoids duplicating the same secret in
# secret/quota-portal and keeps rotation tied to the LiteLLM service's lifecycle.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quota-portal-litellm
  namespace: quota-portal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: quota-portal-litellm
    creationPolicy: Owner
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .litellm_master_key }}"
  data:
    - secretKey: litellm_master_key
      remoteRef:
        key: secret/ai-stack
        property: litellm_master_key
---
# Image pull secret materialized as kubernetes.io/dockerconfigjson so kubelet
# can authenticate to the Gitea container registry on every pull.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-registry
  namespace: quota-portal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitea-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"gitea.sfl":{"auth":"{{ printf "%s:%s" .gitea_username .gitea_token | b64enc }}"}}}'
  data:
    - secretKey: gitea_username
      remoteRef:
        key: secret/quota-portal
        property: gitea_username
    - secretKey: gitea_token
      remoteRef:
        key: secret/quota-portal
        property: gitea_token
