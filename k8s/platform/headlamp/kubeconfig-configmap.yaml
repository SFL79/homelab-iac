# Static kubeconfig that points Headlamp at the in-cluster API server using its
# own mounted ServiceAccount token (read dynamically via `tokenFile`, so kubelet
# token rotation is handled automatically). Headlamp is started with
# `-kubeconfig=/headlamp-kubeconfig/config` (see k8s/apps/headlamp.yaml), which
# makes it authenticate as the `headlamp` SA WITHOUT prompting for a token.
#
# The `headlamp` SA is bound to cluster-admin (headlamp-admin ClusterRoleBinding).
# This intentionally trades per-user auth for zero-friction access on a
# single-user console that is gated purely by the network (.sfl / tailnet).
# Do NOT expose headlamp.sfl beyond the LAN/tailnet without an auth proxy.
#
# Note: released chart 0.42.0 has no native flag for this. Chart >= 0.43.0 adds
# `config.unsafeUseServiceAccountToken: true`, which supersedes this ConfigMap +
# the -kubeconfig arg. Swap to that when the chart is bumped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-kubeconfig
  namespace: headlamp
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: headlamp-sa
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: main
        context:
          cluster: in-cluster
          user: headlamp-sa
    current-context: main
