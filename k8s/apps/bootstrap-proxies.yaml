apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-proxies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: ssh://git@192.168.1.120:222/Homelab/homelab-iac.git
    targetRevision: main
    path: k8s/platform/bootstrap-proxies
  destination:
    server: https://kubernetes.default.svc
    namespace: bootstrap-proxies
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
