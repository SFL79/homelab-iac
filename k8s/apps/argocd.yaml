apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 9.5.4
    helm:
      releaseName: argocd
      valuesObject:
        repoServer:
          # Default liveness probe timeoutSeconds=1 is too tight: the
          # /healthz?full=true check makes an internal gRPC self-call that
          # queues behind concurrent GenerateManifest/git fetches and can take
          # 2-5s, causing spurious SIGTERM restarts (saw 123 restarts / 650
          # probe failures). Relax the timeout so a busy-but-healthy
          # repo-server isn't killed.
          livenessProbe:
            timeoutSeconds: 5
            failureThreshold: 3
        configs:
          params:
            server.insecure: "true"
          ssh:
            extraHosts: |
              [192.168.1.120]:222 ssh-rsa 
              [192.168.1.120]:222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFcGOvF1jS6rsmAMyKaBz5SV7mO67XTXr2FP2SGR+ewE
              [192.168.1.120]:222 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBJBUl21Z7EcXqxMc5M6PZoOFXa3EE31+tzUvmZZ6leDRAlGKOfafV2uflUWq3bkPpdXG94y3ujCpJFD888ScufY=
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
